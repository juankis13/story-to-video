[project]
name = "story-to-video"
version = "0.1.0"
description = "Web app to convert real stories into videos for YouTube/Facebook"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "gtts>=2.5.0",
    "moviepy>=1.0.3",
    "pillow>=10.2.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
